plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'

}

def keyPropertiesFile = rootProject.file('key.properties')
if (keyPropertiesFile.exists()) {
    def keyProperties = new Properties()
    keyProperties.load(new FileInputStream(keyPropertiesFile))
    ext.keyProperties = keyProperties
} else if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }) {
    throw new GradleException("Release signing is missing. Create android/key.properties with storeFile, storePassword, keyAlias, and keyPassword for your Play Store upload key.")
}

android {
    namespace = "com.indexhosting.arise_and_shine"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.indexhosting.arise_and_shine"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion flutter.minSdkVersion
        targetSdk = 36
        versionCode flutter.versionCode.toInteger()
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            if (project.hasProperty('keyProperties')) {
                def key = project.keyProperties
                storeFile file(key['storeFile'])
                storePassword key['storePassword']
                keyAlias key['keyAlias']
                keyPassword key['keyPassword']
            }
        }
    }


    buildTypes {
        release {
           
            signingConfig signingConfigs.release
            shrinkResources true
            minifyEnabled true
            ndk {
                debugSymbolLevel 'FULL' // Options: { NONE, SYMBOL_TABLE, FULL }
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'),'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation(platform("com.google.firebase:firebase-bom:33.7.0"))
    implementation 'com.google.firebase:firebase-analytics'
    implementation("com.google.firebase:firebase-auth")
    implementation("com.google.android.gms:play-services-auth:21.3.0")
}
